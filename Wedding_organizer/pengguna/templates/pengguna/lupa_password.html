<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Wedding Organizer Samarinda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .input-field { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 0.5rem; outline: none; transition: all 0.2s; }
        .input-field:focus { border-color: #DB2777; ring: 2px; ring-color: #FBCFE8; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Lupa Password?</h1>
            <p class="text-gray-500 text-sm mt-2">Masukkan <strong>Username</strong> Anda untuk menerima kode OTP.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="p-3 mb-4 text-sm rounded-lg bg-red-100 text-red-700 text-center">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                {{ form.username }}
            </div>
            <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl transition">
                Kirim Kode OTP
            </button>
            <div class="text-center">
                <a href="{% url 'login' %}" class="text-sm text-gray-400 hover:text-pink-600">Kembali ke Login</a>
            </div>
        </form>
    </div>
</body>
</html>
