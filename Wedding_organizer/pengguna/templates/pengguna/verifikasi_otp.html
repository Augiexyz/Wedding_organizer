<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi OTP - Wedding Organizer Samarinda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .input-field { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 0.5rem; outline: none; transition: all 0.2s; }
        .input-field:focus { border-color: #DB2777; }
        
        /* Animasi Notifikasi Simulasi HP */
        .simulation-toast {
            animation: slideDown 0.5s ease-out;
        }
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col items-center justify-center relative overflow-hidden">

    <!-- SIMULASI NOTIFIKASI HP (DI BAGIAN ATAS) -->
    {% if messages %}
        <div class="absolute top-4 left-0 right-0 z-50 px-4 flex justify-center">
            {% for message in messages %}
                <div class="simulation-toast bg-blue-600 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center max-w-lg w-full border-l-4 border-yellow-400">
                    <div class="bg-blue-500 p-2 rounded-full mr-4">
                        <i data-feather="message-square" class="w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-blue-200 uppercase tracking-wide">Pesan Baru</p>
                        <p class="font-medium text-lg">{{ message }}</p>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center z-10 mt-20">
        <div class="mb-6">
            <div class="w-16 h-16 bg-pink-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-feather="lock" class="w-8 h-8 text-pink-600"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Verifikasi OTP</h1>
            <p class="text-gray-500 text-sm mt-2">Masukkan 4 digit kode yang muncul di notifikasi sistem Anda.</p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div>
                {{ form.otp }}
            </div>
            <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-pink-200">
                Verifikasi
            </button>
        </form>
    </div>

    <script>
        feather.replace();
    </script>
</body>
</html>
